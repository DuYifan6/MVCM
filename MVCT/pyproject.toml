[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvct-research"
version = "0.1.0"
description = "Research implementation of the Multi-View Consistency-Aware Transformer"
requires-python = ">=3.10,<3.13"
dependencies = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
